name: Build

on:
  push:
    branches:
      - "main"
  pull_request:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build binaries
    runs-on: windows-2022
    strategy:
      matrix:
        configuration:
          - Debug
          - Release
    steps:
      - name: Check out files
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          # NOTE - If LFS ever starts getting used during builds, switch this to true!
          lfs: false

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate project files
        run: tools/premake5 vs2022

      - name: Set up problem matching
        uses: ammaraskar/msvc-problem-matcher@master

      - name: Build ${{matrix.configuration}} binaries
        run: msbuild /m /v:minimal /p:Configuration=${{matrix.configuration}} /p:Platform=Win32 build/iw4x.sln

      - name: Upload ${{matrix.configuration}} binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{matrix.configuration}} binaries
          path: |
            build/bin/Win32/${{matrix.configuration}}/iw4x.dll
            build/bin/Win32/${{matrix.configuration}}/iw4x.pdb

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out files
        uses: actions/checkout@v4
        
      - name: Download Debug artifacts
        uses: actions/download-artifact@v4
        with:
          name: Debug binaries
          path: Debug

      - name: Download Release artifacts
        uses: actions/download-artifact@v4
        with:
          name: Release binaries
          path: Release

      - name: Zip Debug binaries
        run: |
          cd Debug
          zip -r ../"Debug binaries.zip" .

      - name: Zip Release binaries
        run: |
          cd Release
          zip -r ../"Release binaries.zip" .

      - name: Delete old release/tag if exists
        run: |
          gh release delete latest -y || true
          git push origin :refs/tags/latest || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create new release
        run: |
          gh release create latest "Debug binaries.zip" "Release binaries.zip" \
            --title "Latest" \
            --notes "Automated build from ${{ github.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
